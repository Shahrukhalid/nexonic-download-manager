<svg xmlns="http://www.w3.org/2000/svg" width="960" height="492" viewBox="0 0 960 492" role="img" aria-labelledby="t d">
  <title id="t">Nexonic Download Manager roadmap</title>
  <desc id="d">The roadmap shown as a download queue: shipped, in progress, next and planned work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#151f3a"/>
    </linearGradient>
    <linearGradient id="done" x1="0" x2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="run" x1="0" x2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <pattern id="stripes" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="24" fill="#ffffff" opacity="0.18"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="24 0" dur="0.8s" repeatCount="indefinite" additive="sum"/>
    </pattern>
    <radialGradient id="glow"><stop offset="0" stop-color="#60a5fa" stop-opacity=".55"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect width="960" height="492" rx="22"/></clipPath>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
      .h{fill:#f8fafc;font-size:26px;font-weight:700}
      .s{fill:#94a3b8;font-size:14px}
      .n{fill:#e2e8f0;font-size:16px;font-weight:600}
      .m{fill:#94a3b8;font-size:12.5px}
      .st{font-size:12px;font-weight:700;letter-spacing:.06em}
      .row{opacity:0;animation:in .6s ease-out forwards}
      .r1{animation-delay:.1s}.r2{animation-delay:.35s}.r3{animation-delay:.6s}.r4{animation-delay:.85s}.r5{animation-delay:1.1s}.r6{animation-delay:1.35s}
      @keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
      .fill{transform-origin:0 0;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) forwards;transform:scaleX(0)}
      @keyframes grow{to{transform:scaleX(1)}}
      .pulse{animation:pulse 1.6s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .blink{animation:blink 1.1s steps(2,start) infinite}
      @keyframes blink{to{visibility:hidden}}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="960" height="492" fill="url(#bg)"/>
    <circle cx="880" cy="40" r="180" fill="url(#glow)" class="pulse"/>
    <!-- window chrome, like the app's own download list -->
    <circle cx="32" cy="32" r="6" fill="#ef4444"/><circle cx="52" cy="32" r="6" fill="#f59e0b"/><circle cx="72" cy="32" r="6" fill="#22c55e"/>
    <text x="32" y="82" class="h">Roadmap</text>
    <text x="32" y="106" class="s">Nexonic Download Manager · what is shipped, downloading now and queued next</text>
    <text x="928" y="80" class="s" text-anchor="end"><tspan class="blink">●</tspan> live</text>

    <!-- row helper: name, detail, bar, status -->
    <g transform="translate(32,134)"><g class="row r1">
      <text class="n" y="18">0.32.0 · Drop target, play while downloading, video tools</text>
      <text class="m" y="38">Rename patterns, phone notices, Quick Look · Android charging rules and widget</text>
      <rect x="610" y="10" width="226" height="14" rx="7" fill="#1e293b"/>
      <rect x="610" y="10" width="226" height="14" rx="7" fill="url(#done)" class="fill"/>
      <text x="896" y="22" class="st" fill="#4ade80" text-anchor="end">DONE ✓</text>
    </g></g>
    <g transform="translate(32,192)"><g class="row r2">
      <text class="n" y="18">Microsoft Store edition</text>
      <text class="m" y="38">Free signed package with automatic Store updates, x64 and Arm</text>
      <rect x="610" y="10" width="226" height="14" rx="7" fill="#1e293b"/>
      <rect x="610" y="10" width="226" height="14" rx="7" fill="url(#run)"/>
      <rect x="610" y="10" width="226" height="14" rx="7" fill="url(#stripes)"/>
      <text x="896" y="22" class="st" fill="#93c5fd" text-anchor="end">NOW</text>
    </g></g>
    <g transform="translate(32,250)"><g class="row r3">
      <text class="n" y="18">Same features everywhere</text>
      <text class="m" y="38">Background profile reading, speed limiter and completion tabs on Windows and Linux</text>
      <rect x="610" y="10" width="226" height="14" rx="7" fill="#1e293b"/>
      <rect x="610" y="10" width="226" height="14" rx="7" fill="url(#run)"/>
      <rect x="610" y="10" width="226" height="14" rx="7" fill="url(#stripes)"/>
      <text x="896" y="22" class="st" fill="#93c5fd" text-anchor="end">NOW</text>
    </g></g>
    <g transform="translate(32,308)"><g class="row r4">
      <text class="n" y="18">Safari extension and a signed Mac app</text>
      <text class="m" y="38">One-click downloads from Safari, and no first-launch warning on macOS</text>
      <rect x="610" y="10" width="226" height="14" rx="7" fill="#1e293b"/>
      <rect x="610" y="10" width="40" height="14" rx="7" fill="#64748b" class="pulse"/>
      <text x="896" y="22" class="st" fill="#cbd5e1" text-anchor="end">NEXT</text>
    </g></g>
    <g transform="translate(32,366)"><g class="row r5">
      <text class="n" y="18">Phone and computer, together</text>
      <text class="m" y="38">Send a link from your phone to your computer, and get its progress back</text>
      <rect x="610" y="10" width="226" height="14" rx="7" fill="#1e293b"/>
      <rect x="610" y="10" width="40" height="14" rx="7" fill="#64748b" class="pulse"/>
      <text x="896" y="22" class="st" fill="#cbd5e1" text-anchor="end">NEXT</text>
    </g></g>
    <g transform="translate(32,424)"><g class="row r6">
      <text class="n" y="18">Watch folder · global shortcut · statistics</text>
      <text class="m" y="38">Drop a list of links into a folder to start it; add a copied link from anywhere; see your data per day</text>
      <rect x="610" y="10" width="226" height="14" rx="7" fill="#1e293b" stroke="#334155" stroke-dasharray="4 4"/>
      <text x="896" y="22" class="st" fill="#64748b" text-anchor="end">QUEUED</text>
    </g></g>
  </g>
</svg>
