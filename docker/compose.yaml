# docker compose -f docker/compose.yaml up -d   then: docker compose -f docker/compose.yaml logs   (shows the pairing code)
services:
  nexonic:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: nexonic-server
    restart: unless-stopped
    ports:
      - "47813:47813"
    environment:
      # The address phones use to reach this machine (its address on your network), shown in the pairing code.
      NDM_HOST: "192.168.1.10"
    volumes:
      - nexonic-data:/data
      - ./downloads:/downloads
volumes:
  nexonic-data:
