<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Nexonic Download Manager</title>
<style>
:root { --bg: #f6f7f9; --card: #fff; --text: #16181d; --muted: #5b6270; --line: #dfe3ea; --accent: #2563eb; --bad: #c62828; --ok: #2e7d32; }
@media (prefers-color-scheme: dark) { :root { --bg: #111318; --card: #1b1e25; --text: #eceff4; --muted: #a3abb9; --line: #2c313b; --accent: #6ea0ff; --bad: #ff7b7b; --ok: #79d27f; } }
* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
header { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 8px; align-items: center; }
h1 { font-size: 17px; margin: 0; flex: 1; }
main { padding: 12px 16px 40px; max-width: 760px; margin: 0 auto; }
form { display: flex; gap: 8px; margin-bottom: 12px; }
input[type=url] { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); }
button { font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); min-height: 44px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
li { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.name { font-weight: 600; word-break: break-word; }
.meta { color: var(--muted); font-size: 14px; margin: 4px 0 8px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.failed .meta { color: var(--bad); }
.finished .bar > span { background: var(--ok); }
#message { color: var(--muted); padding: 24px 0; text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header><h1>Nexonic Download Manager</h1><span id="summary" aria-live="polite"></span></header>
<main>
  <form id="add">
    <label class="sr" for="link">Link to download</label>
    <input id="link" type="url" placeholder="Paste a link to download" autocomplete="off" required>
    <button class="primary" type="submit">Add</button>
  </form>
  <div class="actions" style="margin: 0 0 12px">
    <button type="button" id="resumeAll">Resume all</button>
    <button type="button" id="pauseAll">Stop all</button>
  </div>
  <ul id="list" aria-label="Downloads"></ul>
  <p id="message"></p>
</main>
<script>
(() => {
  'use strict';
  const store = (() => { try { return window.localStorage; } catch { return null; } })();
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get('k')) {
    try { store && store.setItem('ndm-key', hash.get('k')); } catch {}
    history.replaceState(null, '', location.pathname);
  }
  let key = hash.get('k') || (store && (() => { try { return store.getItem('ndm-key'); } catch { return null; } })()) || '';
  const $ = id => document.getElementById(id);
  const message = text => { $('message').textContent = text; };

  async function api(method, path, body) {
    const res = await fetch('/v1/' + path, {
      method, cache: 'no-store',
      headers: Object.assign({ 'Authorization': 'Bearer ' + key }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('Error ' + res.status));
    return data;
  }

  const size = n => n == null ? '' : n >= 1073741824 ? (n / 1073741824).toFixed(2) + ' GB' : n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : n >= 1024 ? Math.round(n / 1024) + ' KB' : n + ' B';
  const labels = { queued: 'Queued', probing: 'Starting', downloading: 'Downloading', paused: 'Stopped', finished: 'Finished', failed: 'Failed', seeding: 'Seeding' };

  function button(text, onClick) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = text;
    b.addEventListener('click', onClick);
    return b;
  }

  function render(list) {
    const ul = $('list');
    ul.replaceChildren();
    for (const d of list) {
      const li = document.createElement('li');
      li.className = d.status;
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = d.fileName;
      const meta = document.createElement('div');
      meta.className = 'meta';
      const amount = d.size ? size(d.received) + ' of ' + size(d.size) : size(d.received);
      meta.textContent = [labels[d.status] || d.status, amount, d.status === 'failed' ? d.error : ''].filter(Boolean).join(' · ');
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.setAttribute('role', 'progressbar');
      bar.setAttribute('aria-label', d.fileName);
      bar.setAttribute('aria-valuemin', '0');
      bar.setAttribute('aria-valuemax', '100');
      bar.setAttribute('aria-valuenow', String(d.progress || 0));
      const fill = document.createElement('span');
      fill.style.width = Math.max(0, Math.min(100, d.progress || 0)) + '%';
      bar.append(fill);
      const actions = document.createElement('div');
      actions.className = 'actions';
      const act = (path, verb) => async () => { try { await api(verb || 'POST', path); refresh(); } catch (e) { message(e.message); } };
      if (['paused', 'failed'].includes(d.status)) actions.append(button('Resume', act('downloads/' + d.id + '/resume')));
      if (['queued', 'probing', 'downloading', 'seeding'].includes(d.status)) actions.append(button('Stop', act('downloads/' + d.id + '/pause')));
      actions.append(button('Remove', async () => { if (confirm('Remove "' + d.fileName + '" from the list? The file stays on the computer.')) await act('downloads/' + d.id, 'DELETE')(); }));
      li.append(name, meta, bar, actions);
      ul.append(li);
    }
  }

  let current = [];
  async function refresh() {
    if (!key) { message('Scan the QR code in Nexonic Download Manager (Options → Remote) to pair this device.'); return; }
    try {
      current = await api('GET', 'downloads');
      render(current);
      const active = current.filter(d => ['downloading', 'probing'].includes(d.status)).length;
      $('summary').textContent = active ? active + ' active' : '';
      message(current.length ? '' : 'No downloads yet.');
    } catch (e) { message(e.message); }
  }

  $('add').addEventListener('submit', async e => {
    e.preventDefault();
    const url = $('link').value.trim();
    if (!url) return;
    try { await api('POST', 'downloads', { url }); $('link').value = ''; refresh(); } catch (err) { message(err.message); }
  });
  const each = (states, action) => async () => {
    for (const d of current.filter(d => states.includes(d.status))) { try { await api('POST', 'downloads/' + d.id + '/' + action); } catch {} }
    refresh();
  };
  $('resumeAll').addEventListener('click', each(['paused', 'failed'], 'resume'));
  $('pauseAll').addEventListener('click', each(['queued', 'probing', 'downloading'], 'pause'));
  refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, 2000);
})();
</script>
</body>
</html>
