name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.8.0"
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [Windows, Mac, Linux, Android, iPhone or iPad, Browser extension]
  - type: textarea
    id: logs
    attributes:
      label: Error output or logs
      render: shell
