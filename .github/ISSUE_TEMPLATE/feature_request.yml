name: Feature request
description: An idea to make Nexonic better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or the task, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: dropdown
    id: os
    attributes:
      label: System
      multiple: true
      options: [Windows, Mac, Linux, Android, iPhone or iPad, Browser extension]
