name: Website
on:
  push:
    branches: [main]
    paths: ["site/**", "VERSION", ".github/workflows/website.yml"]
  release:
    types: [published]
  workflow_run:
    workflows: ["Screenshots", "Android screenshots", "iOS", "Release"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    # Never deploy verification PRs. Release completion also refreshes after GITHUB_TOKEN publishes
    # (that token does not generate a downstream release event).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.name == 'Release'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Add the published version and the latest app screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Main can contain an approved release candidate before its tag is published.
          V="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          V="${V#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid published release version"; exit 1; }
          sed -i "s/__VERSION__/$V/g" site/index.html
          mkdir -p site/img
          git fetch --depth 1 origin screenshots
          for f in mac-main.png mac-main-dark.png mac-add.png mac-scheduler.png mac-info.png mac-progress.png mac-batch.png \
                   windows-main.png windows-add.png windows-scheduler.png windows-info.png windows-progress.png windows-batch.png \
                   android-main.png android-detail.png android-add.png android-browser.png android-found.png android-settings.png android-main-dark.png \
                   ios-main.png ios-detail.png ios-add.png ios-browser.png ios-found.png ios-main-dark.png ipad-main.png ipad-browser.png; do
            git show "origin/screenshots:$f" > "site/img/$f" 2>/dev/null || rm -f "site/img/$f"
          done
          printf 'User-agent: *\nAllow: /\nSitemap: https://shahrukhalid.github.io/nexonic-download-manager/sitemap.xml\n' > site/robots.txt
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://shahrukhalid.github.io/nexonic-download-manager/</loc><lastmod>%s</lastmod></url></urlset>\n' "$(date -u +%F)" > site/sitemap.xml
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
