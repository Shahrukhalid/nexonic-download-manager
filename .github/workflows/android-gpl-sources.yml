name: Android GPL sources
# Builds Android-GPL-Sources.tar.gz again and attaches it to an existing release (for example when a source
# server was down during the release). Does not touch the APKs or any other release file.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to add the sources to (e.g. v0.8.0)"
        required: true
permissions:
  contents: write
jobs:
  gpl-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Same youtubedl-android version as the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          git fetch -q --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
          diff <(git show "$TAG:android/app/build.gradle.kts" | grep youtubedlAndroid) <(grep youtubedlAndroid android/app/build.gradle.kts)
      - name: Collect the sources
        run: bash scripts/android-gpl-sources.sh out
      - name: Add them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" out/Android-GPL-Sources.tar.gz --clobber
