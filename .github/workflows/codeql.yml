name: CodeQL
# Free code scanning for public repositories. Results: Security tab › Code scanning.
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [actions, csharp, javascript-typescript, python]  # Kotlin needs a full Android build to scan
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
