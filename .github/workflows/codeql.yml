name: CodeQL
# Free code scanning for public repositories. Results: Security tab › Code scanning.
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [actions, csharp, javascript-typescript, python]  # Kotlin needs a full Android build to scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
