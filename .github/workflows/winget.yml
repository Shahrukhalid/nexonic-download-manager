# Sends each published release to the Windows Package Manager (winget) as a pull request to microsoft/winget-pkgs,
# so `winget upgrade` offers it. Runs after the Release workflow succeeds (a release published by the Release
# workflow's own token would not start other workflows), or by hand for a given tag.
# Needs the secret WINGET_TOKEN: a classic token with the public_repo scope, and a fork of microsoft/winget-pkgs
# under the same account. Without the secret this does nothing.
name: Winget

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.18.1
        required: true

permissions: {}

concurrency:
  group: winget
  cancel-in-progress: false

jobs:
  winget:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check the release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$HAS_TOKEN" != "true" ]; then echo "No WINGET_TOKEN: skipping winget."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release tag: $TAG"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          draft="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)"
          [ "$draft" = "false" ] || { echo "$TAG is not published"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: Submit to winget
        if: steps.check.outputs.go == 'true'
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: Shahrukhalid.NexonicDownloadManager
          version: ${{ steps.check.outputs.version }}
          release-tag: ${{ steps.check.outputs.tag }}
          installers-regex: 'NexonicDownloadManager-Windows-(ARM64-)?Setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
