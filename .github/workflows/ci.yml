name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ffmpeg-cache/mac
          key: ffmpeg-mac-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Native torrent build tools
        run: brew list ninja pkgconf >/dev/null 2>&1 || brew install ninja pkgconf
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .native-cache/installed
            .native-cache/binaries
            .native-cache/vcpkg/downloads
          key: native-mac-current-${{ hashFiles('native/vcpkg.json', 'native/triplets/**') }}
      - name: Prepare native Apple torrent SDK
        run: python3 scripts/build-torrent-apple.py
      - name: Tests
        run: swift test --package-path mac
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no  # a crash prints where it happened
      - name: Build the app
        env:
          UNIVERSAL: ${{ startsWith(github.head_ref, 'release/') && '1' || '0' }}
        run: bash scripts/build-app.sh
      - name: Check the bundle
        env:
          RELEASE_BRANCH: ${{ startsWith(github.head_ref, 'release/') }}
        run: |
          V="$(cat VERSION)"
          A="build/Nexonic Download Manager.app/Contents"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$A/Info.plist")" = "$V"
          if [ "$RELEASE_BRANCH" = "true" ]; then
            for f in NexonicDownloadManager nexonic-host ffmpeg; do
              archs="$(lipo -archs "$A/MacOS/$f")"
              [[ "$archs" == *x86_64* && "$archs" == *arm64* ]] || { echo "$f is not universal"; exit 1; }
            done
          fi
          test -x "build/Nexonic Download Manager.app/Contents/MacOS/NexonicDownloadManager"
          test -x "build/Nexonic Download Manager.app/Contents/MacOS/nexonic-host"
          test -f "build/Nexonic Download Manager.app/Contents/Resources/AppIcon.icns"
          test -f "build/Nexonic Download Manager.app/Contents/Resources/Extension/manifest.json"
          test -f "build/Nexonic Download Manager.app/Contents/Resources/Firefox Add-on.xpi"
          "build/Nexonic Download Manager.app/Contents/MacOS/nexonic-host" help | grep -q "ndm batch"
          "build/Nexonic Download Manager.app/Contents/MacOS/ffmpeg" -hide_banner -muxers | grep -q " mp4 "
          lipo -archs "build/Nexonic Download Manager.app/Contents/MacOS/ffmpeg"
          test ! -e "build/Nexonic Download Manager.app/Contents/MacOS/nexonic-video-engine"  # downloaded on first use
          .tools-cache/mac/yt-dlp-engine/yt-dlp_macos --version
          "build/Nexonic Download Manager.app/Contents/MacOS/qjs" -e 'console.log("qjs ok")'
      - name: Video engine joins picture and sound (local test video)
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install -q ffmpeg
          mkdir -p /tmp/site && pushd /tmp/site
          ffmpeg -loglevel error -f lavfi -i testsrc=size=640x360:rate=25 -f lavfi -i sine=frequency=440 -t 4 -map 0:v -map 1:a \
            -c:v libx264 -c:a aac -f dash -adaptation_sets "id=0,streams=v id=1,streams=a" dash.mpd
          python3 -m http.server 8777 --bind 127.0.0.1 >/dev/null 2>&1 &
          # Wait until the local server answers (a busy runner can take a few seconds to start it).
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8777/dash.mpd && break; sleep 1; done
          M="$GITHUB_WORKSPACE/build/Nexonic Download Manager.app/Contents/MacOS"
          "$GITHUB_WORKSPACE/.tools-cache/mac/yt-dlp-engine/yt-dlp_macos" --ignore-config --ffmpeg-location "$M" -f "bv*+ba/b" --merge-output-format "mp4/mkv" -P /tmp/out \
            -o "test.%(ext)s" http://127.0.0.1:8777/dash.mpd
          "$M/ffprobe" -v error -show_entries stream=codec_type -of csv /tmp/out/test.mp4 | sort | tr '\n' ' ' | grep -q "stream,audio stream,video"
          popd
          plutil -lint "build/Nexonic Download Manager.app/Contents/Info.plist"
          python3 scripts/host-ping.py "build/Nexonic Download Manager.app/Contents/MacOS/nexonic-host"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nexonic-download-manager
          path: build/*.dmg
  ffmpeg-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: .ffmpeg-cache/windows
          key: ffmpeg-windows-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y -qq mingw-w64 && bash scripts/build-ffmpeg.sh windows .ffmpeg-cache/windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ffmpeg-windows
          path: .ffmpeg-cache/windows
      - name: Video engine for Windows
        run: bash scripts/fetch-video-tools.sh windows .tools-cache/windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tools-windows
          path: .tools-cache/windows
  windows:
    # The x64 job keeps the name "windows": branch protection requires a check with that name.
    name: ${{ matrix.rid == 'win-x64' && 'windows' || 'windows-arm64' }}
    needs: ffmpeg-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ffmpeg-windows
          path: .ffmpeg-cache/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tools-windows
          path: .tools-cache/windows
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .native-cache/installed
            .native-cache/binaries
            .native-cache/vcpkg/downloads
          key: native-${{ matrix.rid }}-${{ hashFiles('native/vcpkg.json', 'native/triplets/**') }}
      - name: Native torrent engine and legal-data transfer
        run: python scripts/build-torrent-native.py ${{ matrix.rid }} --test
      - name: Managed provider integration
        shell: pwsh
        run: dotnet run --project native/tests/dotnet "-p:NativeTorrentLibrary=$env:GITHUB_WORKSPACE/.native-cache/sdk/${{ matrix.rid }}/bin/nexonic_torrent.dll" -- .native-cache/sdk/${{ matrix.rid }}/bin/nexonic_torrent.dll
      - name: Tests
        run: dotnet test windows/Tests/Tests.csproj
      - name: Build the app and installer
        run: ./windows/build.ps1 -Rid ${{ matrix.rid }}
        shell: pwsh
      - name: Bundled ffmpeg runs
        shell: pwsh
        run: |
          if (-not (Test-Path build\win\ffmpeg.exe)) { throw "ffmpeg.exe missing from the app folder" }
          $m = & build\win\ffmpeg.exe -hide_banner -muxers 2>&1 | Out-String
          if ($m -notmatch " mp4 ") { throw "ffmpeg has no mp4 muxer: $m" }
          if (Test-Path build\win\video-engine) { throw "the video engine is shipped again (the app downloads it on first use)" }
          & .tools-cache\windows\yt-dlp\yt-dlp.exe --version
          if ($LASTEXITCODE -ne 0) { throw "the video engine does not run" }
      - name: Upgrade from v0.21.0 preserves data
        if: startsWith(github.head_ref, 'release/') && matrix.rid == 'win-x64'
        shell: pwsh
        run: ./scripts/test-windows-upgrade.ps1
      - name: The Arm build is an Arm program
        if: matrix.rid == 'win-arm64'
        shell: pwsh
        run: |
          # PE machine type 0xAA64 = ARM64 (the x64 build is 0x8664).
          foreach ($f in "NexonicDownloadManager.exe", "nexonic-host.exe", "nexonic_torrent.dll") {
            $b = [IO.File]::ReadAllBytes("build\win\$f"); $pe = [BitConverter]::ToInt32($b, 0x3C)
            $m = [BitConverter]::ToUInt16($b, $pe + 4)
            if ($m -ne 0xAA64) { throw "$f is not an ARM64 program (machine 0x$($m.ToString('X')))" }
          }
          $v = (Get-Content VERSION).Trim()
          if (-not (Test-Path "build\NexonicDownloadManager-Setup-$v-arm64.exe")) { throw "the Arm installer was not built" }
      - name: Helper answers a ping
        shell: pwsh
        run: |
          $body = [Text.Encoding]::UTF8.GetBytes('{"type":"ping"}')
          $p = New-Object Diagnostics.Process
          $p.StartInfo.FileName = "build\win\nexonic-host.exe"
          $p.StartInfo.RedirectStandardInput = $true
          $p.StartInfo.RedirectStandardOutput = $true
          $p.StartInfo.UseShellExecute = $false
          $p.Start() | Out-Null
          $s = $p.StandardInput.BaseStream
          $s.Write([BitConverter]::GetBytes($body.Length), 0, 4); $s.Write($body, 0, $body.Length); $s.Close()
          $out = $p.StandardOutput.ReadToEnd(); $p.WaitForExit()
          if ($out -notmatch '"ok":true') { throw "no ping answer: $out" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nexonic-download-manager-${{ matrix.rid }}
          path: build/*.exe
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Unit and fuzz tests
        run: npm ci --ignore-scripts --no-audit --no-fund && node --test
        working-directory: extension
      - name: Release versions are consistent
        run: python3 scripts/check-release.py
      - name: Manifest is valid JSON with the fixed key
        run: python3 -c "import json; m=json.load(open('extension/manifest.json')); assert m['manifest_version']==3 and m['key']"
      - name: Build the Chrome extension and the Firefox add-on
        run: |
          python3 scripts/build-extensions.py
          node --check build/extension-firefox/background.js
          node --check extension/content.js
          node --check extension/collect.js
      - name: Firefox add-on passes the linter
        run: npx --yes web-ext@8 lint --source-dir build/extension-firefox --warnings-as-errors=false
      - name: No outside names
        run: "! grep -rniE 'cl[a]ude|anthr[o]pic' --exclude-dir=.git --exclude-dir=.github ."
