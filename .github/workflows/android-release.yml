name: Android release
# Adds the signed Android app to the release of the same tag. Runs next to the Mac/Windows Release workflow
# (which it does not change) and waits until that workflow has created the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to add the Android app to (e.g. v0.6.8)"
        required: true
permissions:
  contents: write
jobs:
  # GPL-3.0 section 6: the source of the app's GPL video engine and its libraries, next to the APKs.
  gpl-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Collect the sources
        run: bash scripts/android-gpl-sources.sh out
      - name: Add them to the release (waits for the Release workflow to create it)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" out/Android-GPL-Sources.tar.gz --clobber
              echo "Added the GPL sources to $TAG"; exit 0
            fi
            sleep 30
          done
          echo "The release $TAG was not created within 30 minutes"; exit 1
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Native build tools
        timeout-minutes: 15
        run: |
          for try in 1 2 3; do
            timeout 300 sudo apt-get update -qq && timeout 400 sudo apt-get install -y -qq ninja-build pkg-config autoconf automake libtool && exit 0
            sleep 20
          done
          exit 1
      - uses: actions/cache@v4
        with:
          path: |
            .native-cache/installed
            .native-cache/binaries
            .native-cache/vcpkg/downloads
          key: native-android-${{ hashFiles('native/vcpkg.json', 'native/triplets/**', 'native/src/**', 'native/include/**') }}
          restore-keys: native-android-
      - name: Torrent engine for Android
        run: bash scripts/android-torrent-libs.sh arm64 arm
      - name: Torrent engine sources (exact source archives used for the build)
        run: |
          set -euo pipefail
          mkdir -p tsrc && cp -r native tsrc/nexonic-native
          find .native-cache/vcpkg/downloads -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.tar.xz' -o -name '*.zip' -o -name '*.tar.bz2' \) -exec cp {} tsrc/ \;
          git -C .native-cache/vcpkg rev-parse HEAD > tsrc/vcpkg-commit.txt
          tar -czf Android-Torrent-Sources.tar.gz -C tsrc .
          ls -la Android-Torrent-Sources.tar.gz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.NDM_ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "The NDM_ANDROID_* secrets are missing: no unsigned app is published."; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NDM_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Tests and signed release build
        env:
          NDM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NDM_ANDROID_KEYSTORE_PASSWORD }}
          NDM_ANDROID_KEY_ALIAS: nexonic
          NDM_ANDROID_KEY_PASSWORD: ${{ secrets.NDM_ANDROID_KEY_PASSWORD }}
        run: gradle -p android --no-daemon testDebugUnitTest assembleRelease
      - name: Check the signature and version
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          R=android/app/build/outputs/apk/release
          # arm64 for almost every phone; -32bit for older phones.
          cp $R/app-arm64-v8a-release.apk NexonicDownloadManager-Android.apk
          cp $R/app-armeabi-v7a-release.apk NexonicDownloadManager-Android-32bit.apk
          for f in NexonicDownloadManager-Android.apk NexonicDownloadManager-Android-32bit.apk; do
            "$BT/apksigner" verify --print-certs $f | grep "certificate SHA-256"
            "$BT/aapt2" dump badging $f | grep "^package" | grep -q "versionName='$(cat VERSION)'"
          done
          ls -la NexonicDownloadManager-Android*.apk
      - name: Add it to the release (waits for the Release workflow to create it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" NexonicDownloadManager-Android.apk NexonicDownloadManager-Android-32bit.apk Android-Torrent-Sources.tar.gz --clobber
              echo "Added the Android APKs to $TAG"; exit 0
            fi
            sleep 30
          done
          echo "The release $TAG was not created within 30 minutes"; exit 1
