name: Android
on:
  push:
    branches: [main, feature/mobile-platforms]
    paths: ["VERSION", "android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["VERSION", "android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Release signing key (only when the secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.NDM_ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NDM_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Tests
        run: gradle -p android --no-daemon testDebugUnitTest
      - name: Build the APKs
        env:
          NDM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NDM_ANDROID_KEYSTORE_PASSWORD }}
          NDM_ANDROID_KEY_ALIAS: nexonic # not a secret; as a secret GitHub would hide every "nexonic" in the logs
          NDM_ANDROID_KEY_PASSWORD: ${{ secrets.NDM_ANDROID_KEY_PASSWORD }}
        run: |
          # Separately: release builds make one APK per processor type, debug builds one APK for all.
          gradle -p android --no-daemon assembleDebug
          gradle -p android --no-daemon assembleRelease
      - name: Check the APKs
        run: |
          set -e
          mkdir -p out
          DBG=android/app/build/outputs/apk/debug/app-debug.apk
          R=android/app/build/outputs/apk/release
          ls -la $R
          # One release APK per processor type: arm64 (almost every phone) and 32-bit ARM (older phones).
          for abi in arm64-v8a armeabi-v7a; do
            rel=$(ls $R/app-$abi-release*.apk | head -1)
            name=NexonicDownloadManager-Android
            if [ "$abi" = armeabi-v7a ]; then name=$name-32bit; fi
            suffix=""
            if [[ "$rel" == *unsigned* ]]; then suffix=-unsigned; fi
            cp "$rel" "out/$name-release$suffix.apk"
          done
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          AAPT="$BT/aapt2"
          # Release builds are shrunk by R8: the video engine's classes that are used by reflection must survive,
          # or the engine fails on phones only (debug builds are not shrunk).
          AN=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/apkanalyzer | head -1)
          REL=$(ls out/NexonicDownloadManager-Android-release*.apk | head -1)
          CLASSES=$("$AN" dex packages --defined-only "$REL")
          for cls in org.apache.commons.compress.archivers.zip.ExtraFieldUtils org.apache.commons.compress.archivers.zip.AsiExtraField \
                     com.yausername.youtubedl_android.YoutubeDL com.yausername.youtubedl_android.mapper.VideoInfo com.yausername.ffmpeg.FFmpeg; do
            # The class name is the last column of apkanalyzer's list.
            echo "$CLASSES" | awk '{print $NF}' | grep -qx "$cls" || {
              echo "R8 removed or renamed $cls: the video engine would break"
              echo "$CLASSES" | grep -i "commons\|yausername" | head -5; exit 1; }
          done
          echo "Video engine classes are intact in the release APK."
          if ls out/*release.apk >/dev/null 2>&1; then
            echo "Release APK signature:"
            "$BT/apksigner" verify --verbose --print-certs out/NexonicDownloadManager-Android-release.apk | grep -E "Verified using|Signer #1 certificate DN|SHA-256 digest"
          else
            echo "Release APK is unsigned: set the NDM_ANDROID_* secrets (android/setup-android-signing.sh)."
          fi
          "$AAPT" dump badging $DBG | grep -E "^package|sdkVersion|targetSdk|native-code"
          "$AAPT" dump permissions $DBG
          ls -la out
          sha256sum out/*.apk
      - name: Licenses and bundled components
        run: |
          set -e
          REL=$(ls out/NexonicDownloadManager-Android-release*.apk | head -1)
          # The license screen must ship in every APK.
          for f in NOTICES.txt GPL-3.0.txt Apache-2.0.txt PSF-2.0-Python.txt MIT-Nexonic.txt; do
            unzip -l "$REL" "assets/licenses/$f" >/dev/null || { echo "missing assets/licenses/$f"; exit 1; }
          done
          # Inventory for the third-party notices: Java libraries, and the native files inside the video engine.
          {
            echo "== Runtime libraries"; gradle -p android --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath | grep -E "^[+\\| ]" | sed 's/^[-+\\| ]*//' | sort -u
            echo "== Native files"; T=$(mktemp -d); unzip -q -o "$REL" 'lib/arm64-v8a/*' -d "$T"
            for z in "$T"/lib/arm64-v8a/*.zip.so; do [ -f "$z" ] || continue; echo "-- $(basename "$z")"; unzip -Z1 "$z" | grep -E '\.so(\.|$)|/bin/' | sed 's#.*/##' | sort -u; done
            ls "$T"/lib/arm64-v8a
          } > out/android-components.txt
          cat out/android-components.txt
      - name: GPL source list resolves (the release attaches the full archive)
        run: |
          grep -q 'YTDL_TAG='"$(grep -o 'youtubedlAndroid = "[^"]*"' android/app/build.gradle.kts | cut -d'"' -f2)" scripts/android-gpl-sources.sh \
            || { echo "youtubedl-android version changed: update scripts/android-gpl-sources.sh"; exit 1; }
          DRY=1 bash scripts/android-gpl-sources.sh "$RUNNER_TEMP/gpl" | tail -3
      - name: Test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: android/app/build/reports
      - uses: actions/upload-artifact@v7
        with:
          name: NexonicDownloadManager-Android
          path: |
            out/*.apk
            out/android-components.txt
