name: Native torrent Windows diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  managed:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Fetch the already-tested SDK (same engine sources)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41944977147 --repo Shahrukhalid/nexonic-download-manager --name torrent-native-win-x64 --dir .native-cache/sdk/win-x64
      - name: Reproduce managed native transfer
        shell: pwsh
        run: dotnet run --project native/tests/dotnet "-p:NativeTorrentLibrary=$env:GITHUB_WORKSPACE/.native-cache/sdk/win-x64/bin/nexonic_torrent.dll" -- .native-cache/sdk/win-x64/bin/nexonic_torrent.dll
