name: Native torrents
on:
  pull_request:
    paths: ["native/**", "windows/Core/**", "scripts/build-torrent-native.py", ".github/workflows/native-torrents.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: windows-latest
            target: win-x64
          - runner: macos-15
            target: mac-current
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: runner.os != 'macOS'
        with:
          dotnet-version: '8.0.x'
      - name: Native build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build pkg-config autoconf automake libtool
      - name: Native build tools (Mac)
        if: runner.os == 'macOS'
        run: brew install ninja pkgconf
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .native-cache/installed
            .native-cache/binaries
            .native-cache/vcpkg/downloads
          save-always: true
          key: native-${{ matrix.target }}-${{ hashFiles('native/vcpkg.json', 'native/triplets/**') }}
      - name: Build, real transfer and integrity tests
        run: python scripts/build-torrent-native.py ${{ matrix.target }} --test
      - name: Managed host real-transfer tests (Linux)
        if: runner.os == 'Linux'
        run: dotnet run --project native/tests/dotnet -p:NativeTorrentLibrary="$GITHUB_WORKSPACE/.native-cache/sdk/${{ matrix.target }}/lib/libnexonic_torrent.so" -- .native-cache/sdk/${{ matrix.target }}/lib/libnexonic_torrent.so
      - name: Managed host real-transfer tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet run --project native/tests/dotnet "-p:NativeTorrentLibrary=$env:GITHUB_WORKSPACE/.native-cache/sdk/${{ matrix.target }}/bin/nexonic_torrent.dll" -- .native-cache/sdk/${{ matrix.target }}/bin/nexonic_torrent.dll
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: torrent-native-${{ matrix.target }}
          path: .native-cache/sdk/${{ matrix.target }}
