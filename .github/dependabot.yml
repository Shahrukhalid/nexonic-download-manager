# Dependency updates: monthly, small batches, no major versions (those are updated by hand after testing).
# Avalonia (all its packages must move together), Kotlin, Compose and the Android build tools are also updated by
# hand: their updates need code changes and a real-device check.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /extension
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
  - package-ecosystem: nuget
    directories: [/windows/App, /windows/Core, /windows/Host, /windows/Tests, /linux/App, /linux/Desktop, /linux/Server, /linux/Tests]
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      - dependency-name: "Avalonia*"
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "com.android.tools.build*"
      - dependency-name: "com.android.application"
      - dependency-name: "androidx.compose*"
